<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sea Universe: Sprite Mapper</title>
<style>
  :root{
    --bg:#0f1b22; --panel:#16262f; --panel2:#1c2f3a; --line:#2b4552;
    --ink:#e8f1f4; --muted:#8fa9b5; --blue:#3d92bc; --gold:#e0a34a;
    --green:#4f9d69; --red:#c85a5a; --purple:#a07ac0;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI",system-ui,sans-serif}

  header{
    position:sticky; top:0; z-index:20; background:var(--panel);
    border-bottom:1px solid var(--line); padding:11px 18px 0;
  }
  .hrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-bottom:10px}
  header h1{margin:0; font-size:17px; letter-spacing:.04em; white-space:nowrap}
  .stats{color:var(--muted); font-size:12.5px}
  .stats b{color:var(--ink)}
  .spacer{flex:1}
  button{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    padding:7px 13px; border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit;
  }
  button:hover:not(:disabled){border-color:var(--blue)}
  button.primary{background:var(--blue); border-color:var(--blue); color:#06181f; font-weight:600}
  button.danger:hover{border-color:var(--red)}

  /* tabs */
  .tabs{display:flex; gap:2px}
  .tab{
    background:transparent; border:1px solid transparent; border-bottom:none;
    border-radius:7px 7px 0 0; padding:9px 18px; cursor:pointer; color:var(--muted);
    font-size:13.5px; font-family:inherit; position:relative; top:1px;
  }
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--bg); border-color:var(--line); color:var(--ink); font-weight:600}
  .tab .cnt{font-size:11px; color:var(--muted); margin-left:7px; font-weight:400}
  .tab.on .cnt{color:var(--gold)}
  .tab .pfx{
    display:inline-block; font:11px/1 Consolas,monospace; background:var(--panel2);
    border:1px solid var(--line); border-radius:3px; padding:2px 5px; margin-left:7px; color:var(--muted);
  }

  main{display:grid; grid-template-columns:1fr 340px; gap:18px; padding:18px; align-items:start}
  @media (max-width:1100px){ main{grid-template-columns:1fr} }

  h2.sec{
    font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold);
    margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  h2.sec:first-child{margin-top:0}
  h2.sec span{color:var(--muted); text-transform:none; letter-spacing:0; font-size:12px; margin-left:8px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px}

  .t{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:11px; display:flex; gap:11px; cursor:pointer; transition:border-color .12s;
  }
  .t:hover{border-color:#3f6478}
  .t.sel{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold)}
  .t.alias{opacity:.62; cursor:default}
  .t.alias:hover{border-color:var(--line)}

  .thumb{
    width:64px; flex:none; border-radius:5px; border:1px dashed var(--line);
    background:var(--panel2); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:10px; text-align:center; overflow:hidden;
  }
  .thumb img{width:100%; height:100%; object-fit:contain; display:block}
  .thumb.filled{border-style:solid; border-color:var(--green)}
  .thumb.existing{border-style:solid; border-color:var(--blue)}

  .meta{min-width:0; flex:1}
  .nm{font-weight:600; font-size:14.5px}
  .rl{color:var(--blue); font-size:12px}
  .zn{color:var(--muted); font-size:11.5px; margin-bottom:5px}
  .ds{color:#bed0d8; font-size:11.5px; line-height:1.42; max-height:4.3em; overflow:hidden}
  .t.sel .ds{max-height:none}
  .chip{
    display:inline-block; font-size:10px; padding:1px 6px; border-radius:99px;
    margin-top:6px; margin-right:5px; border:1px solid var(--line); color:var(--muted);
  }
  .chip.ok{border-color:var(--green); color:#8fd6a6}
  .chip.has{border-color:var(--blue); color:#8fc9e0}
  .chip.act{border-color:var(--gold); color:var(--gold)}
  .chip.bad{border-color:var(--red); color:#f0a0a0}

  aside{position:sticky; top:112px}
  .pool{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px}
  .pool h3{margin:0 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.09em; color:var(--gold)}
  .hint{color:var(--muted); font-size:11.5px; margin:0 0 10px}
  .hint b{color:var(--ink)}
  label.tog{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); margin-bottom:10px; cursor:pointer}

  .pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px; max-height:62vh; overflow:auto}
  .pit{border:1px solid var(--line); border-radius:5px; background:var(--panel2); padding:3px; cursor:pointer; text-align:center; transition:border-color .12s}
  .pit:hover{border-color:var(--gold)}
  .pit img{width:100%; object-fit:contain; display:block; max-height:96px}
  .pit .fn{font-size:10px; color:var(--muted); margin-top:2px}
  .pit.dim{opacity:.32}

  button.on{background:var(--gold); border-color:var(--gold); color:#06181f; font-weight:600}
  button.wide{width:100%; margin-top:10px}

  /* still-to-generate list */
  aside{display:flex; flex-direction:column; gap:14px; max-height:calc(100vh - 128px); overflow:auto}
  .pool.todo .todo-list{max-height:46vh; overflow:auto; margin-bottom:2px}
  .todo-item{
    padding:7px 0; border-top:1px solid var(--line);
    font-size:11.5px; line-height:1.45; color:#c3d4dc;
  }
  .todo-item:first-child{border-top:none}

  .modal{position:fixed; inset:0; background:rgba(4,12,17,.86); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px}
  .modal.hidden{display:none}
  .mbox{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:18px; max-width:820px; width:100%; max-height:86vh; display:flex; flex-direction:column}
  .mbox h3{margin:0 0 8px; font-size:15px}
  textarea{flex:1; min-height:340px; width:100%; background:#0b161c; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:11px; font:12px/1.5 Consolas,monospace; resize:vertical}
  .mrow{display:flex; gap:9px; margin-top:11px; align-items:center}
  .warn{background:#3a2418; border:1px solid #7a4a2a; color:#f0c49a; padding:9px 12px; border-radius:6px; font-size:12.5px; margin:0 18px}
</style>
</head>
<body>

<!-- Game data. Classic scripts, so this works opened straight off disk. -->
<script>window.SU = window.SU || {}; SU.data = SU.data || {};</script>

<script src="../data/zone_arctic.js"></script>
<script src="../data/npcs_arctic.js"></script>
<script src="../data/zone_ocean.js"></script>
<script src="../data/npcs_ocean.js"></script>
<script src="../data/species_deep.js"></script>
<script src="../data/zone_deep.js"></script>
<script src="../data/npcs_deep.js"></script>
<script src="../data/zone_end.js"></script>

<script src="../data/npcs_kayla.js"></script>
<script src="../data/npcs_side.js"></script>

<header>
  <div class="hrow">
    <h1>🐬 Sprite Mapper</h1>
    <div class="stats" id="stats">Loading…</div>
    <div class="spacer"></div>
    <button id="btnHideDone">Hide completed</button>
    <button id="btnAdd">Add files…</button>
    <button id="btnClear" class="danger">Clear all</button>
    <button id="btnGen" class="primary">Generate rename prompt</button>
    <input type="file" id="filePick" accept=".svg,.png,.webp" multiple hidden>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div id="loadWarn"></div>

<main>
  <section id="targets"></section>

  <aside>
    <div class="pool">
      <h3>Unassigned pool</h3>
      <p class="hint" id="poolCount"></p>
      <p class="hint">Click something on the left, then click an image here.
        Click an assigned thumbnail to free it again.</p>
      <label class="tog"><input type="checkbox" id="togAll">
        Show every pool file, ignoring the prefix</label>
      <div class="pgrid" id="pgrid"></div>
    </div>

    <div class="pool todo">
      <h3>Still to generate</h3>
      <p class="hint" id="todoCount"></p>
      <div class="todo-list" id="todoList"></div>
      <button id="btnCopyTodo" class="wide">Copy list</button>
    </div>
  </aside>
</main>

<div class="modal hidden" id="modal">
  <div class="mbox">
    <h3>Copy this and paste it back into Claude Code</h3>
    <p class="hint">Nothing on disk has changed yet. Claude does the renaming.</p>
    <textarea id="out" spellcheck="false"></textarea>
    <div class="mrow">
      <button class="primary" id="btnCopy">Copy to clipboard</button>
      <button id="btnClose">Close</button>
      <span class="stats" id="copyNote"></span>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const POOL_DIR = '../sprites/Unassigned/';
const ART_DIR  = '../sprites/';
const LSKEY    = 'su_sprite_mapper_v2';
const OLDKEY   = 'su_sprite_mapper_v1';

/* ------------------------------------------------------------------
   FILENAME PREFIX CONVENTION (the user's naming scheme)
     A…  animals      P…  props      E…  park employees
     plain number …   general characters (visitors, contacts, outsiders)
   ------------------------------------------------------------------ */
const PREFIXES = [
  { key:'animal',    re:/^A\d/i, label:'A' },
  { key:'prop',      re:/^P\d/i, label:'P' },
  { key:'tile',      re:/^T\d/i, label:'T' },
  { key:'employee',  re:/^E\d/i, label:'E' },
  { key:'character', re:/^\d/,   label:'1-9' }
];
function poolGroup(file){
  const hit = PREFIXES.find(p => p.re.test(file));
  return hit ? hit.key : 'character';
}

const TABS = [
  { id:'characters', label:'Characters', noun:'character', prefix:'E… + 1-9', accepts:['employee','character'] },
  { id:'animals',    label:'Animals',    noun:'animal',    prefix:'A…',       accepts:['animal'] },
  { id:'props',      label:'Props',      noun:'prop',      prefix:'P…',       accepts:['prop'] },
  { id:'tiles',      label:'Tiles',      noun:'tile',      prefix:'T…',       accepts:['tile'] }
];

/* Roles NOT on the park payroll. Anything else counts as staff, so NPCs
   added for zones 3-5 classify themselves with no edit here. */
const OUTSIDER = /visitor|handler|subversive|campaign|activist|journalist/i;

   ------------------------------------------------------------------ */
const NPC_BRIEF = {

  /* --- The Meridian gate crew. The uniform is the point: four people in

/* Props vary in shape, so each carries its own canvas + ratio. */
const PROP_BRIEF = {

  umbrella: { c:'128 × 256', r:0.500, d:'A large red and white parasol on a thin pole, canopy open, café shade umbrella.' },

/* ------------------------------------------------------------------

   matter more than anything in the descriptions:

     1. SEAMLESS. Each one is laid edge to edge in a grid thousands of
        times over. The left edge must continue into the right and the
        top into the bottom, with no seam and no visible repeat.
     2. STRAIGHT DOWN. Flat top-down, no perspective and no horizon.
     3. NO BAKED LIGHTING. No sun direction, no drop shadows, no
        vignette. The renderer already varies brightness per tile, and
        a light source drawn into the texture fights it and turns the
        whole floor into a checkerboard.

   screen, so fine detail turns to noise and anything busy makes the
   characters standing on it unreadable. These are backgrounds.

   ------------------------------------------------------------------ */

/* ---------- helpers ---------- */

function probe(url){
  return new Promise(res=>{
    const i = new Image();
    i.onload  = ()=>res({ok:true, w:i.naturalWidth, h:i.naturalHeight});
    i.onerror = ()=>res({ok:false});
    i.src = url;
  });
}

/* Discovery fires ~160 probes and these files are large (raster-in-SVG
   runs to ~600 KB each), so run them a few at a time rather than all at
   once. Precautionary: no failure has been observed without it. */
async function mapLimit(items, limit, fn){
  const out = new Array(items.length);
  let next = 0;
  async function worker(){
    while (next < items.length){ const i = next++; out[i] = await fn(items[i]); }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}
function zoneName(id){
  const z = SU.data.zones && SU.data.zones[id];
  return (z && z.name) || String(id||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(map)); }catch(e){} }
function load(){
  try{ map = JSON.parse(localStorage.getItem(LSKEY)) || {}; }catch(e){ map = {}; }
  // v1 stored bare NPC ids; carry them over so nobody loses their work
  if (!Object.keys(map).length){
    try{
      const old = JSON.parse(localStorage.getItem(OLDKEY));
      if (old) { Object.keys(old).forEach(k => map['npc:'+k] = old[k]); save(); }
    }catch(e){}
  }
}

/* ---------- build the target list from live game data ---------- */

function fallbackBrief(def){
  const out = [ (def.role||'Character').replace(/-/g,' '), 'in ' + zoneName(def.zone) + '.' ];
  const first = def.dialogue && def.dialogue.find(d=>d.lines && d.lines.length);
  if (first){
    const spoken = first.lines.find(l=>/^[A-Z][A-Z '.]+:/.test(l)) || first.lines[0];
    out.push('Sample line: ' + spoken.replace(/^[A-Z][A-Z '.]+:\s*/,'“') + '”');
  }
  return out.join(' ');
}

function collect(){
  const D = SU.data, out = [];

  Object.keys(D.npcs||{}).forEach(id=>{
    const def = D.npcs[id];
    out.push({
      key:'npc:'+id, tab:'characters',
      group: OUTSIDER.test(def.role||'') ? 'character' : 'employee',
      name: def.name || id, sub: def.role || '-', where: zoneName(def.zone),
      code: id, file: 'npc_' + id + '.svg', art: 'npc_' + (def.sprite || id),
      alias: def.sprite || null,
      brief: NPC_BRIEF[id] || fallbackBrief(def),
      canvas: '128 × 192', ratio: 0.667
    });
  });

  Object.keys(D.species||{}).forEach(id=>{
    const sp = D.species[id];
    out.push({
      key:'animal:'+id, tab:'animals', group:'animal',
      name: sp.name || id, sub: 'Species', where: 'Care Session portrait',
      code: id, file: 'animal_' + id + '.svg', art: 'animal_' + id, alias:null,
      brief: ANIMAL_BRIEF[id] || 'Whole animal visible, centred, anatomically accurate for teaching.',
      canvas: '512 × 512', ratio: 1.0
    });
  });

  Object.keys(D.props||{}).forEach(t=>{
    const p = D.props[t], b = PROP_BRIEF[t];
    out.push({
      key:'prop:'+t, tab:'props', group:'prop',
      name: p.name || t, sub: p.solid ? 'Solid, blocks movement' : 'Walkable scenery',
      where: 'shape: ' + p.shape, code: t,
      file: 'prop_' + t + '.svg', art: 'prop_' + t, alias:null,
      brief: b ? b.d : 'Scenery prop.',
      canvas: b ? b.c : '128 × 128', ratio: b ? b.r : 1.0
    });
  });

  /* Ground tiles. All one canvas and one ratio, so unlike props they
     carry no per-item geometry. The placeholder colour is shown as the
     location, because that is the thing the art is replacing. */
  Object.keys(D.tiles||{}).forEach(t=>{
    const def = D.tiles[t];
    out.push({
      key:'tile:'+t, tab:'tiles', group:'tile',
      name: t, sub: def.solid ? 'Solid, blocks movement' : 'Walkable ground',
      where: 'placeholder ' + (def.colour || ''), code: t,
      file: 'tile_' + t + '.svg', art: 'tile_' + t, alias:null,
      brief: TILE_BRIEF[t] || 'Seamless top-down ground texture, low contrast, no baked lighting.',
      canvas: '128 × 128', ratio: 1.0
    });
  });

  return out;
}

async function detectExistingArt(){
  await mapLimit(TARGETS, 8, async t=>{
    for (const ext of ['svg','png','webp']){
      const r = await probe(ART_DIR + t.art + '.' + ext);
      if (r.ok){ t.hasArt = true; t.artUrl = ART_DIR + t.art + '.' + ext; return; }
    }
  });
}

/* Directory listing is impossible from file://, so probe the naming
   patterns in use and keep whatever answers. "Add files…" covers the rest. */
async function discoverPool(){
  /* 'T' added with the Tiles tab. Anything outside this range, or named
     some other way, still arrives through "Add files…", which is how the
     500-series and a-series files in the pool got here. */
  const names = [];
  for (let i=1;i<=40;i++) ['','E','A','P','T'].forEach(p=>names.push(p+i+'.svg'));
  const found = await mapLimit(names, 8, async f=>{
    const r = await probe(POOL_DIR + f);
    return r.ok ? { file:f, url:POOL_DIR+f, group:poolGroup(f), w:r.w, h:r.h } : null;
  });
  pool = found.filter(Boolean).sort(cmpFile);
}

function cmpFile(a,b){
  const oa = PREFIXES.findIndex(p=>p.key===a.group), ob = PREFIXES.findIndex(p=>p.key===b.group);
  if (oa !== ob) return oa - ob;
  return (parseInt(a.file.replace(/\D/g,''),10)||0) - (parseInt(b.file.replace(/\D/g,''),10)||0);
}

    const list = tabTargets(T.id);
    const done = list.filter(covered).length;
    const b = document.createElement('button');
    b.className = 'tab' + (tab===T.id ? ' on' : '');
    b.innerHTML = T.label +
      '<span class="cnt">' + done + '/' + list.length + '</span>' +
      '<span class="pfx">' + T.prefix + '</span>';
    b.onclick = ()=>{ tab = T.id; selected = null; render(); };
    host.appendChild(b);
  });
}

function renderStats(){
  const all = TARGETS.filter(t=>!t.alias);
  const free = pool.length - taken().size;
  document.getElementById('stats').innerHTML =
    '<b>' + all.filter(covered).length + '</b>/' + all.length + ' sprites covered overall · ' +
    '<b>' + free + '</b>/' + pool.length + ' pool images free';
  document.getElementById('poolCount').innerHTML =
    '<b>' + free + '</b> of <b>' + pool.length + '</b> still free. Assigned images leave this list.';
}

function renderTargets(){
  const host = document.getElementById('targets');
  host.innerHTML = '';

  const groups = tab === 'characters'
    ? [['employee','Park employees','on the Sea Universe payroll, E-numbered files'],
       ['character','Other characters','visitors, contacts and outsiders, plain-numbered files']]
    : tab === 'animals'
      ? [['animal','Species','Care Session portraits, anatomy is the teaching payload']]
      : tab === 'tiles'
        ? [['tile','Ground tiles','all 128 × 128 and all SEAMLESS, top-down, no baked lighting']]
        : [['prop','Scenery props','note the canvas, props are not all the same shape']];

  groups.forEach(([g,title,sub])=>{
    /* Aliases are excluded here and listed once in their own section
       below, otherwise they render twice. */
    const list = TARGETS.filter(t=>t.tab===tab && t.group===g && !t.alias && !(hideDone && covered(t)))
                        .sort((a,b)=> (covered(a)-covered(b)) || a.name.localeCompare(b.name));
    if (!list.length) return;
    const h = document.createElement('h2');
    h.className='sec';
    h.innerHTML = title + '<span>' + list.length + ' · ' + sub + '</span>';
    host.appendChild(h);
    const grid = document.createElement('div');
    grid.className='grid';
    list.forEach(t=>grid.appendChild(card(t)));
    host.appendChild(grid);
  });

  // aliases (characters reusing another's art) listed once, at the end.
  // They need no image, so "Hide completed" hides them too.
  const al = hideDone ? [] : TARGETS.filter(t=>t.tab===tab && t.alias);
  if (al.length){
    const h=document.createElement('h2'); h.className='sec';
    h.innerHTML='Reuses existing art<span>' + al.length + ' · no new image needed</span>';
    host.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid';
    al.forEach(t=>grid.appendChild(card(t)));
    host.appendChild(grid);
  }

  if (!host.children.length){
    host.innerHTML = '<h2 class="sec">Nothing outstanding<span>every ' +
      TABS.find(t=>t.id===tab).noun +
      ' sprite has art</span></h2>' +
      '<p class="hint">Turn off <b>Hide completed</b> to see them again.</p>';
  }
}

/* ---- still-to-generate list ----
   Lives under the pool so the art can be generated straight down the
   list without hunting through the cards for what is missing. */
function renderTodo(){
  const T = TABS.find(x=>x.id===tab);
  const list = TARGETS.filter(t=>t.tab===tab && !t.alias && !covered(t))
                      .sort((a,b)=>a.name.localeCompare(b.name));

  document.getElementById('todoCount').innerHTML =
    '<b>' + list.length + '</b> ' + T.noun +
    ' sprite' + (list.length===1?'':'s') + ' with no art yet.';

  const host = document.getElementById('todoList');
  host.innerHTML = list.length
    ? list.map(t => '<div class="todo-item">' + esc(shortOf(t)) + '</div>').join('')
    : '<p class="hint">All done on this tab.</p>';

  document.getElementById('btnCopyTodo').disabled = !list.length;
  window.__todoText = list.map(shortOf).join('\n');
}

function card(t){
  const el = document.createElement('div');
  el.className = 't' + (t.alias?' alias':'') + (selected===t.key?' sel':'');

  const assigned = map[t.key];
  const pi  = assigned ? poolItem(assigned) : null;
  const src = pi ? pi.url : (t.hasArt ? t.artUrl : null);
  const cls = assigned ? 'filled' : (t.hasArt ? 'existing' : '');

  const chips = [];
  if (t.alias)        chips.push('<span class="chip">reuses ' + t.alias + '.svg</span>');
  else if (assigned)  chips.push('<span class="chip ok">→ ' + t.file + '</span>');
  else if (t.hasArt)  chips.push('<span class="chip has">art already in place</span>');
  else                chips.push('<span class="chip act">needs art</span>');
  chips.push('<span class="chip">' + t.canvas + '</span>');

  // wrong aspect ratio is the one thing that reliably breaks a sprite
  if (pi && pi.w && pi.h){
    const actual = pi.w / pi.h;
    if (Math.abs(actual - t.ratio) / t.ratio > 0.12){
      chips.push('<span class="chip bad">ratio ' + actual.toFixed(2) +
                 ', wants ' + t.ratio.toFixed(2) + ', will render distorted</span>');
    }
  }

  el.innerHTML =
    '<div class="thumb ' + cls + '" style="height:' + Math.round(64 / (t.ratio||1)) + 'px">' +
      (src ? '<img src="' + src + '" alt="">' : 'no art') +
    '</div>' +
    '<div class="meta">' +
      '<div class="nm">' + esc(t.name) + '</div>' +
      '<div class="rl">' + esc(t.sub) + '</div>' +
      '<div class="zn">' + esc(t.where) + ' · <code>' + esc(t.code) + '</code></div>' +
      '<div class="ds">' + esc(t.brief) + '</div>' +
      chips.join('') +
    '</div>';

  if (!t.alias){
    el.onclick = ev=>{
      if (assigned && ev.target.closest('.thumb')){ delete map[t.key]; save(); render(); return; }
      selected = (selected===t.key) ? null : t.key;
      render();
    };
  }
  return el;
}

function renderPool(){
  const grid = document.getElementById('pgrid');
  const t = taken();
  const showAll = document.getElementById('togAll').checked;
  const T = TABS.find(x=>x.id===tab);
  const sel = selected ? TARGETS.find(x=>x.key===selected) : null;

  const items = pool.filter(p=>!t.has(p.file) && (showAll || T.accepts.includes(p.group)))
                    .sort((a,b)=>{
    if (sel){                                   // exact-group matches first
      const am = a.group===sel.group, bm = b.group===sel.group;
      if (am !== bm) return am ? -1 : 1;
    }
    return cmpFile(a,b);
  });

  grid.innerHTML = '';
  items.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'pit' + (sel && p.group !== sel.group ? ' dim' : '');
    d.innerHTML = '<img src="' + p.url + '" alt="" loading="lazy"><div class="fn">' + esc(p.file) + '</div>';
    d.onclick = ()=>{
      if (!selected){ flash('Pick something on the left first.'); return; }
      map[selected] = p.file;
      selected = null;
      save(); render();
    };
    grid.appendChild(d);
  });

  if (!grid.children.length){
    grid.innerHTML = '<p class="hint" style="grid-column:1/-1">' +
      (showAll ? 'Every pool image is assigned.'
               : 'No free <b>' + T.prefix + '</b> files. Tick the box above to see the rest.') + '</p>';
  }
}

function flash(msg){
  const s = document.getElementById('stats');
  s.innerHTML = '<b style="color:#e0a34a">' + esc(msg) + '</b>';
  setTimeout(renderStats, 1800);
}

/* ---------- the rename prompt ---------- */

function buildPrompt(){
  const rows = TARGETS.filter(t=>!t.alias && map[t.key]).map(t=>({
    tab: t.tab,
    from: 'sprites/Unassigned/' + map[t.key],
    to  : 'sprites/' + t.file,
    who : t.name,
    replacing: t.hasArt
  }));
  if (!rows.length) return 'Nothing is assigned yet. Assign some images in the sprite mapper first.';

  const w = Math.max(...rows.map(r=>r.from.length));
  const block = id => {
    const g = rows.filter(r=>r.tab===id);
    if (!g.length) return null;
    return '  # ' + TABS.find(t=>t.id===id).label + '\n' + g.map(r=>
      '  ' + r.from.padEnd(w) + '  ->  ' + r.to + '   # ' + r.who +
      (r.replacing ? '   (REPLACES existing art)' : '')).join('\n');
  };
  const body = TABS.map(t=>block(t.id)).filter(Boolean).join('\n\n');
  const left = TARGETS.filter(t=>!t.alias && !map[t.key] && !t.hasArt);

  return [
    'Rename my Sea Universe sprite files. In C:\\Users\\timwi\\Downloads\\Claude\\sea-universe\\,',
    'move each file on the left to the path on the right:',
    '', body, '',
    'Rules:',
    '  - Move them out of sprites/Unassigned/ into sprites/, and do not leave copies behind.',
    '  - Keep the .svg extension exactly as-is.',
    '  - Any file in sprites/Unassigned/ not listed above stays where it is.',
    (rows.some(r=>r.replacing)
      ? '  - Lines marked REPLACES overwrite art that is already there. Show me those and confirm first.'
      : '  - Nothing here overwrites existing art.'),
    '',
    'Then run the content validator and tell me if any sprite failed to load.',
    left.length
      ? '\nStill unassigned after this: ' +
        TABS.map(t=>{
          const g = left.filter(x=>x.tab===t.id);
          return g.length ? t.label.toLowerCase() + ': ' + g.map(x=>x.name).join(', ') : null;
        }).filter(Boolean).join('; ') + '.'
      : '\nThat covers every sprite in the game.'
  ].join('\n');
}

/* ---------- wiring ---------- */

document.getElementById('btnGen').onclick = ()=>{
  document.getElementById('out').value = buildPrompt();
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('out').select();
};
document.getElementById('btnClose').onclick = ()=>document.getElementById('modal').classList.add('hidden');
document.getElementById('btnCopy').onclick = async ()=>{
  const ta = document.getElementById('out'); ta.select();
  try{ await navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); }
  document.getElementById('copyNote').textContent = 'Copied.';
  setTimeout(()=>document.getElementById('copyNote').textContent='', 2000);
};
document.getElementById('btnClear').onclick = ()=>{
  const n = Object.keys(map).length;
  if (!n) return;
  if (!confirm('Clear all ' + n + ' assignments? Files on disk are not touched.')) return;
  map = {}; selected = null; save(); render();
};
document.getElementById('togAll').onchange = renderPool;

document.getElementById('btnHideDone').onclick = () => {
  hideDone = !hideDone;
  const b = document.getElementById('btnHideDone');
  b.textContent = hideDone ? 'Show all' : 'Hide completed';
  b.classList.toggle('on', hideDone);
  selected = null;
  render();
};

document.getElementById('btnCopyTodo').onclick = async () => {
  const txt = window.__todoText || '';
  if (!txt) return;
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const b = document.getElementById('btnCopyTodo');
  const old = b.textContent;
  b.textContent = 'Copied';
  setTimeout(() => { b.textContent = old; }, 1500);
};
document.getElementById('btnAdd').onclick = ()=>document.getElementById('filePick').click();
document.getElementById('filePick').onchange = e=>{
  const files = [...e.target.files];
  let pending = files.length;
  files.forEach(f=>{
    if (pool.some(p=>p.file===f.name)){ if(!--pending) render(); return; }
    const url = URL.createObjectURL(f);
    const probeImg = new Image();
    probeImg.onload = probeImg.onerror = ()=>{
      pool.push({ file:f.name, url, group:poolGroup(f.name), w:probeImg.naturalWidth, h:probeImg.naturalHeight });
      pool.sort(cmpFile);
      if(!--pending) render();
    };
    probeImg.src = url;
  });
};

/* ---------- boot ---------- */

(async function init(){
  if (!SU.data.npcs || !SU.data.props){
    document.getElementById('loadWarn').innerHTML =
      '<p class="warn">Could not read the game data files. Keep this page in the project\'s ' +
      '<code>tools/</code> folder so <code>../data/…</code> resolves.</p>';
    return;
  }
  load();
  TARGETS = collect();
  render();
  await Promise.all([detectExistingArt(), discoverPool()]);

  const have = new Set(pool.map(p=>p.file));
  let dropped = false;
  Object.keys(map).forEach(k=>{ if(!have.has(map[k])){ delete map[k]; dropped = true; } });
  if (dropped) save();

  render();
})();

})();
</script>
